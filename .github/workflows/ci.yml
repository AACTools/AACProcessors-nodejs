name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          CI: true

      - name: Verify browser build output
        run: test -f dist/browser/index.browser.js

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  rn-bundle:
    name: React Native bundle guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Metro 0.87 requires Node >= 22.13 (the test matrix also runs Node 20).
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            test/rn-metro-check/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Metro fixture dependencies
        run: npm ci --prefix test/rn-metro-check

      - name: Verify browser build bundles with Metro (React Native)
        run: npm run verify:rn-bundle
