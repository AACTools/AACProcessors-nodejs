name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          CI: true

      - name: Verify browser build output
        run: test -f dist/browser/index.browser.js

      # Metro 0.87 requires Node >= 22.13, so only run the React Native guard
      # on the Node 22 leg. `test:ci` has already built dist/browser.
      - name: Install Metro fixture dependencies
        if: matrix.node-version == 22
        run: npm ci --prefix test/rn-metro-check

      - name: Verify browser build bundles with Metro (React Native)
        if: matrix.node-version == 22
        run: node scripts/verify-rn-bundle.js

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
